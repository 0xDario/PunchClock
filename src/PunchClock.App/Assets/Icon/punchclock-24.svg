<!-- PunchClock app icon at 24px, drawn on the pixel grid so edges stay sharp. Used for the 20px and 24px images in PunchClock.ico. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
<defs><linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C5282"/><stop offset="1" stop-color="#1A365D"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="23" height="18" rx="3" fill="url(#body)" stroke="#5B8BC9" stroke-width="1"/>
<circle cx="12" cy="8" r="7" fill="#14202E"/>
<circle cx="12" cy="8" r="6" fill="#FFFFFF"/>
<rect x="11" y="3" width="2" height="6" fill="#14202E"/>
<rect x="7" y="7" width="6" height="2" fill="#14202E"/>
<rect x="7.5" y="16.5" width="9" height="7" fill="#FFF7E3" stroke="#B8A57A" stroke-width="1"/>
<rect x="9" y="19" width="3" height="1" fill="#14202E" opacity="0.75"/>
<rect x="13" y="19" width="2" height="1" fill="#D63B2F"/>
<rect x="3" y="16" width="18" height="1" fill="#0B1726"/>
</svg>
