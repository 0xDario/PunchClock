<rect x="9" y="1" width="6" height="2" fill="#D63B2F"/>
<circle cx="7" cy="9" r="7" fill="#14202E"/>
<circle cx="7" cy="9" r="6" fill="#FFFFFF"/>
<rect x="6" y="4" width="1" height="5" fill="#14202E"/>
<rect x="3" y="8" width="4" height="1" fill="#14202E"/>
</svg>
