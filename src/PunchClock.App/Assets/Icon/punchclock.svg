<!-- PunchClock app icon, 40px and up: a wall clock with a time card tucked behind it.
     Smaller sizes have their own pixel-aligned drawings (punchclock-16/24/32.svg).
     Rebuild PunchClock.ico with build_icon.py after editing any of them. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Time card, tilted behind the clock, with printed in (dark) and out (red) times. -->
  <g transform="rotate(12 176 105)">
    <rect x="118" y="30" width="116" height="150" rx="7" fill="#FFF7E3" stroke="#B8A57A" stroke-width="4"/>
    <path d="M118 51 V37 a7 7 0 0 1 7 -7 H227 a7 7 0 0 1 7 7 V51 Z" fill="#D63B2F"/>
    <g stroke="#D8C9A3" stroke-width="3">
      <line x1="130" y1="78" x2="222" y2="78"/>
      <line x1="130" y1="98" x2="222" y2="98"/>
      <line x1="130" y1="118" x2="222" y2="118"/>
      <line x1="130" y1="138" x2="222" y2="138"/>
      <line x1="130" y1="158" x2="222" y2="158"/>
    </g>
    <g fill="#14202E" fill-opacity="0.75">
      <rect x="134" y="66" width="35" height="6" rx="2"/>
      <rect x="134" y="86" width="35" height="6" rx="2"/>
      <rect x="134" y="106" width="35" height="6" rx="2"/>
    </g>
    <g fill="#D63B2F">
      <rect x="183" y="66" width="35" height="6" rx="2"/>
      <rect x="183" y="86" width="35" height="6" rx="2"/>
    </g>
  </g>

  <!-- Clock face. -->
  <circle cx="110" cy="140" r="98" fill="#14202E"/>
  <circle cx="110" cy="140" r="87" fill="#FFFFFF"/>
  <g stroke="#14202E" stroke-linecap="round">
    <g stroke-width="7">
      <line x1="110" y1="62" x2="110" y2="80"/>
      <line x1="110" y1="62" x2="110" y2="80" transform="rotate(90 110 140)"/>
      <line x1="110" y1="62" x2="110" y2="80" transform="rotate(180 110 140)"/>
      <line x1="110" y1="62" x2="110" y2="80" transform="rotate(270 110 140)"/>
    </g>
    <g stroke-width="3.5">
      <line x1="110" y1="62" x2="110" y2="72" transform="rotate(30 110 140)"/>
      <line x1="110" y1="62" x2="110" y2="72" transform="rotate(60 110 140)"/>
      <line x1="110" y1="62" x2="110" y2="72" transform="rotate(120 110 140)"/>
      <line x1="110" y1="62" x2="110" y2="72" transform="rotate(150 110 140)"/>
      <line x1="110" y1="62" x2="110" y2="72" transform="rotate(210 110 140)"/>
      <line x1="110" y1="62" x2="110" y2="72" transform="rotate(240 110 140)"/>
      <line x1="110" y1="62" x2="110" y2="72" transform="rotate(300 110 140)"/>
      <line x1="110" y1="62" x2="110" y2="72" transform="rotate(330 110 140)"/>
    </g>
    <!-- 9:00, start of shift. -->
    <line x1="110" y1="140" x2="66" y2="140" stroke-width="10"/>
    <line x1="110" y1="140" x2="110" y2="84" stroke-width="7"/>
  </g>
  <line x1="102" y1="126" x2="144" y2="199" stroke="#D63B2F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="110" cy="140" r="6" fill="#D63B2F"/>
</svg>
